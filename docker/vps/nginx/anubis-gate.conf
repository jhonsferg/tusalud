auth_request /_anubis_check;
error_page 401 = @anubis_challenge;

location = /_anubis_check {
    internal;
    if ($anubis_skip) {
        return 204;
    }
    proxy_pass http://127.0.0.1:10020/.within.website/x/cmd/anubis/api/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Http-Version $server_protocol;
    proxy_set_header X-TLS-SNI-Name $ssl_server_name;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @anubis_abierto;
}

location @anubis_abierto {
    return 204;
}

location ^~ /.within.website/ {
    auth_request off;
    proxy_pass http://127.0.0.1:10020;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Http-Version $server_protocol;
    proxy_set_header X-TLS-SNI-Name $ssl_server_name;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}

location @anubis_challenge {
    add_header Cache-Control "no-store" always;
    return 307 /.within.website/?redir=$scheme://$host$request_uri;
}
