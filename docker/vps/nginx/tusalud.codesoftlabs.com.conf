server {
    listen 80;
    listen [::]:80;
    server_name tusalud.codesoftlabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        if ($is_blocked_country) {
            return 444;
        }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tusalud.codesoftlabs.com;

    ssl_certificate /etc/letsencrypt/live/tusalud.codesoftlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tusalud.codesoftlabs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/geoip-block.conf;

    access_log /var/log/nginx/tusalud_codesoftlabs.access.log;
    error_log /var/log/nginx/tusalud_codesoftlabs.error.log;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.tusalud.codesoftlabs.com; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://api.tusalud.codesoftlabs.com wss://api.tusalud.codesoftlabs.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:10012;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header X-Http-Version $server_protocol;
        proxy_set_header X-TLS-SNI-Name $ssl_server_name;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
