map "$host|$request_uri" $anubis_skip {
    default 0;
    "~^[^|]+\|.*(\.\.|%2[eE]|%5[cC]|//)" 0;
    "~^[^|]+\|/(\.well-known/|favicon\.ico($|\?)|robots\.txt($|\?)|sitemap\.xml($|\?))" 1;
    "~^(www\.)?wayki\.codesoftlabs\.com\|/(api/|health($|[/?]))" 1;
    "~^warlay\.codesoftlabs\.com\|/auth/" 1;
    "~^git\.codesoftlabs\.com\|/(api/|v2/|login/oauth/|assets/|attachments/|avatars?/|repo-avatars/)" 1;
    "~^git\.codesoftlabs\.com\|/[^/?]+/[^/?]+\.git($|[/?])" 1;
    "~^git\.codesoftlabs\.com\|/[^/?]+/[^/?]+/(info/(refs|lfs)|git-upload-pack|git-receive-pack|git-upload-archive|HEAD|objects/)" 1;
    "~^git\.codesoftlabs\.com\|/[^/?]+/[^/?]+/(releases/download|archive|raw|media|attachments|badges)/" 1;
}
