server {
    listen 80;
    listen [::]:80;
    server_name api.tusalud.codesoftlabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        if ($is_blocked_country) {
            return 444;
        }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tusalud.codesoftlabs.com;

    ssl_certificate /etc/letsencrypt/live/api.tusalud.codesoftlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tusalud.codesoftlabs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/geoip-block.conf;

    access_log /var/log/nginx/api_tusalud_codesoftlabs.access.log;
    error_log /var/log/nginx/api_tusalud_codesoftlabs.error.log;

    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ ^/(v3/api-docs|swagger-ui|h2-console|actuator) {
        return 404;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:10010;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:10010;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
