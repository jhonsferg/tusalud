server {
    listen 80;
    listen [::]:80;
    server_name api.tusalud.codesoftlabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        if ($is_blocked_country) {
            return 444;
        }
        return 301 https://$host$request_uri;
    }
}
