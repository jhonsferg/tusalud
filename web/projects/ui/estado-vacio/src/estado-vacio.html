<div class="estado">
  <div class="marco">
    <img
      [src]="'img/comun/estados/' + imagen() + '-768.webp'"
      [attr.srcset]="
        'img/comun/estados/' +
        imagen() +
        '-768.webp 768w, img/comun/estados/' +
        imagen() +
        '-1536.webp 1536w'
      "
      sizes="(min-width: 700px) 24rem, 85vw"
      width="768"
      height="512"
      loading="lazy"
      decoding="async"
      alt=""
    />
  </div>
  <h3>{{ title() }}</h3>
  @if (message(); as text) {
    <p>{{ text }}</p>
  }
  <div class="acciones"><ng-content /></div>
</div>
