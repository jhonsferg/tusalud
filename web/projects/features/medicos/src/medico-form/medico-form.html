<app-page-header
  title="Nuevo médico"
  subtitle="Crea la cuenta del profesional y asígnale su especialidad"
  icon="pi-user-plus"
  backLink="/medicos"
  backLabel="Volver a médicos"
/>

<form class="panel" style="max-width: 50rem" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="form-grid">
    <app-form-field
      label="Nombre"
      [control]="form.controls.nombre"
      inputId="med-nombre"
      [required]="true"
    >
      <input pInputText id="med-nombre" formControlName="nombre" class="w-full" />
    </app-form-field>

    <app-form-field
      label="Apellido"
      [control]="form.controls.apellido"
      inputId="med-apellido"
      [required]="true"
    >
      <input pInputText id="med-apellido" formControlName="apellido" class="w-full" />
    </app-form-field>

    <app-form-field
      label="Email"
      [control]="form.controls.email"
      inputId="med-email"
      [required]="true"
    >
      <input
        pInputText
        id="med-email"
        type="email"
        formControlName="email"
        autocomplete="off"
        class="w-full"
      />
    </app-form-field>

    <app-form-field
      label="Contraseña inicial"
      [control]="form.controls.password"
      inputId="med-password"
      hint="Entre 8 y 72 caracteres"
      [required]="true"
    >
      <p-password
        inputId="med-password"
        formControlName="password"
        [toggleMask]="true"
        autocomplete="new-password"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </app-form-field>

    <app-form-field
      label="Teléfono"
      [control]="form.controls.telefono"
      inputId="med-telefono"
      hint="Opcional, 9 dígitos"
    >
      <input
        pInputText
        id="med-telefono"
        formControlName="telefono"
        inputmode="tel"
        maxlength="9"
        class="w-full"
      />
    </app-form-field>

    <app-form-field
      label="Colegiatura"
      [control]="form.controls.colegiatura"
      inputId="med-colegiatura"
      [required]="true"
    >
      <input pInputText id="med-colegiatura" formControlName="colegiatura" class="w-full" />
    </app-form-field>

    <app-form-field
      label="Especialidades"
      [control]="form.controls.especialidadIds"
      hint="El precio de la consulta lo define cada especialidad"
      inputId="med-especialidad"
      [required]="true"
    >
      <p-multiselect
        inputId="med-especialidad"
        formControlName="especialidadIds"
        [options]="especialidades.opciones()"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecciona una o más especialidades"
        [loading]="especialidades.list.loading()"
        [filter]="true"
        filterPlaceholder="Buscar"
        display="chip"
        appendTo="body"
        styleClass="w-full"
      />
    </app-form-field>

    <app-form-field
      label="Consultorio"
      [control]="form.controls.consultorio"
      inputId="med-consultorio"
      hint="Opcional"
    >
      <input pInputText id="med-consultorio" formControlName="consultorio" class="w-full" />
    </app-form-field>
  </div>

  <div class="flex gap-2 justify-content-end mt-4">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" routerLink="/medicos" />
    <p-button type="submit" label="Registrar médico" icon="pi pi-check" [loading]="submitting()" />
  </div>
</form>
