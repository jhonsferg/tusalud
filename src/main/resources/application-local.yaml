spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tusalud}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: TusaludHikariPool
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  telemedicina:
    turn:
      secreto: ${TURN_SECRET:secreto-turn-solo-desarrollo}
  jwt:
    secret: ${JWT_SECRET:7M+c4b4GZSekiWHhQKtFdWMk3BbcEwa1YQ0PqmCFie75dy5ko50rildSWFTsI18NTxineFm3/IIKY1lyrZn89g==}

logging:
  level:
    com.codesoftlabs.tusalud.app: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
