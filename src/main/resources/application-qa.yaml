spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tusalud}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: TusaludHikariPool
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:7M+c4b4GZSekiWHhQKtFdWMk3BbcEwa1YQ0PqmCFie75dy5ko50rildSWFTsI18NTxineFm3/IIKY1lyrZn89g==}
  data-initializer:
    enabled: ${DATA_INITIALIZER_ENABLED:false}

logging:
  level:
    root: INFO
    com.codesoftlabs.tusalud.app: INFO
    org.hibernate.SQL: WARN
