spring:
  threads:
    virtual:
      enabled: true
  application:
    name: tusalud-api
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 40MB
  profiles:
    active: "@spring.profiles.active@"
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  jackson:
    time-zone: America/Lima
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: tusalud-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
    exposed-headers: Authorization
    max-age: 3600
  version: "@project.version@"
  seguridad:
    retencion-dias: ${SEGURIDAD_RETENCION_DIAS:90}
    accesos-denegados-umbral: 5
    login-fallidos-umbral: 5
    descargas-umbral: 30
  hospitalizacion:
    horas-evolucion-pendiente: ${HOSPITALIZACION_HORAS_EVOLUCION:8}
  mfa:
    clave-cifrado: ${MFA_CLAVE_CIFRADO:clave-de-desarrollo-para-cifrar-secretos-mfa}
  pagos:
    simulacion-habilitada: ${PAGOS_SIMULACION_HABILITADA:true}
    expiracion-qr-minutos: 5
  telemedicina:
    ventana-antes-min: ${TELEMEDICINA_VENTANA_ANTES_MIN:10}
    ventana-despues-min: ${TELEMEDICINA_VENTANA_DESPUES_MIN:30}
    ticket-ttl-seg: 30
    version-consentimiento: "1.0"
    max-mensajes-por-ventana: 120
    inactividad-seg: 90
    turn:
      habilitado: ${TURN_HABILITADO:true}
      host: ${TURN_HOST:localhost}
      puerto: ${TURN_PORT:3478}
      secreto: ${TURN_SECRET:}
      ttl-seg: 3600
  documentos-medicos:
    url-verificacion: ${DOCUMENTOS_URL_VERIFICACION:http://localhost:4600/verificar/}
    descanso-max-dias: ${DESCANSO_MAX_DIAS:30}
    descanso-retroactivo-dias: ${DESCANSO_RETROACTIVO_DIAS:3}
    verificacion-por-minuto: ${VERIFICACION_POR_MINUTO:20}
  canales:
    worker-habilitado: ${CANALES_WORKER_HABILITADO:true}
    url-base: ${CANALES_URL_BASE:http://localhost:4600}
    secreto: ${CANALES_SECRETO:secreto-de-desarrollo-para-enlaces-de-baja}
    webhook-secreto: ${CANALES_WEBHOOK_SECRETO:}
    centro: ${CANALES_CENTRO:TuSalud}
    limite-por-hora: ${CANALES_LIMITE_POR_HORA:10}
    reintentos:
      maximo: 5
      base-seg: 30
      techo-seg: 3600
    codigo:
      ttl-min: 10
      max-intentos: 5
      reenvios-por-hora: 5
      espera-seg: 60
    correo:
      proveedor: ${CANALES_CORREO_PROVEEDOR:simulado}
      remitente: ${CANALES_CORREO_REMITENTE:no-responder@tusalud.local}
      nombre-remitente: ${CANALES_CORREO_NOMBRE:TuSalud}
    sms:
      proveedor: ${CANALES_SMS_PROVEEDOR:simulado}
      http:
        url: ${CANALES_SMS_URL:}
        autenticacion: ${CANALES_SMS_AUTENTICACION:NONE}
        usuario: ${CANALES_SMS_USUARIO:}
        secreto: ${CANALES_SMS_SECRETO:}
        formato: ${CANALES_SMS_FORMATO:FORM}
        cuerpo: ${CANALES_SMS_CUERPO:}
        campo-id-externo: ${CANALES_SMS_CAMPO_ID:sid}
        tiempo-limite-seg: 10
    whatsapp:
      proveedor: ${CANALES_WHATSAPP_PROVEEDOR:simulado}
      http:
        url: ${CANALES_WHATSAPP_URL:}
        autenticacion: ${CANALES_WHATSAPP_AUTENTICACION:BEARER}
        usuario: ${CANALES_WHATSAPP_USUARIO:}
        secreto: ${CANALES_WHATSAPP_SECRETO:}
        formato: ${CANALES_WHATSAPP_FORMATO:JSON}
        cuerpo: ${CANALES_WHATSAPP_CUERPO:}
        campo-id-externo: ${CANALES_WHATSAPP_CAMPO_ID:messages.0.id}
        tiempo-limite-seg: 10
  facturacion:
    sede-por-defecto: ${FACTURACION_SEDE:PRINCIPAL}
    url-verificacion: ${FACTURACION_URL_CONSULTA:https://e-consulta.sunat.gob.pe/ol-ti-itconsvalicpe/ConsValiCpe.htm}
    cola-habilitada: ${FACTURACION_COLA_HABILITADA:true}
    cron-resumen: ${FACTURACION_CRON_RESUMEN:0 30 0 * * *}
    certificado:
      ruta: ${FACTURACION_CERTIFICADO_RUTA:}
      clave: ${FACTURACION_CERTIFICADO_CLAVE:}
      alias: ${FACTURACION_CERTIFICADO_ALIAS:}
      generar-de-prueba: ${FACTURACION_CERTIFICADO_PRUEBA:true}
    sol:
      usuario: ${FACTURACION_SOL_USUARIO:}
      clave: ${FACTURACION_SOL_CLAVE:}
    cola:
      intervalo-ms: ${FACTURACION_COLA_INTERVALO_MS:10000}
      intentos-maximos: 6
      retroceso-base-segundos: 30
  privacidad:
    cron-retencion: ${PRIVACIDAD_CRON_RETENCION:0 15 2 * * *}
    retencion-habilitada: ${PRIVACIDAD_RETENCION_HABILITADA:true}
    horas-notificar-autoridad: 48
  respaldos:
    token: ${RESPALDO_TOKEN:}
    vigilancia-habilitada: ${RESPALDOS_VIGILANCIA_HABILITADA:true}
    max-horas-sin-respaldo: ${RESPALDOS_MAX_HORAS:26}
    max-dias-sin-prueba: ${RESPALDOS_MAX_DIAS_SIN_PRUEBA:8}
    rpo-objetivo-horas: 24
    rto-objetivo-minutos: 60
  documentos:
    retencion-exportaciones: ${DOCUMENTOS_RETENCION:7d}
    maximo-concurrentes: 3
    maximo-por-hora: 20
    sincronico: false
  storage:
    tipo: ${STORAGE_TIPO:local}
    endpoint: ${STORAGE_ENDPOINT:}
    endpoint-publico: ${STORAGE_ENDPOINT_PUBLICO:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style: true
    directorio-local: ${STORAGE_DIRECTORIO_LOCAL:}
    vigencia-prefirmada: 5m
    buckets:
      avatares: ${STORAGE_BUCKET_AVATARES:avatares}
      imagenes: ${STORAGE_BUCKET_IMAGENES:imagenes}
      documentos: ${STORAGE_BUCKET_DOCUMENTOS:documentos}
      reportes: ${STORAGE_BUCKET_REPORTES:reportes}
      plantillas: ${STORAGE_BUCKET_PLANTILLAS:plantillas}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

logging:
  level:
    root: INFO
    com.codesoftlabs.tusalud.app: INFO
