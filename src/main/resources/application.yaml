spring:
  threads:
    virtual:
      enabled: true
  application:
    name: tusalud-api
  profiles:
    active: "@spring.profiles.active@"
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  jackson:
    time-zone: America/Lima
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: tusalud-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
    exposed-headers: Authorization
    max-age: 3600
  mfa:
    clave-cifrado: ${MFA_CLAVE_CIFRADO:clave-de-desarrollo-para-cifrar-secretos-mfa}
  pagos:
    simulacion-habilitada: ${PAGOS_SIMULACION_HABILITADA:true}
    expiracion-qr-minutos: 5

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

logging:
  level:
    root: INFO
    com.codesoftlabs.tusalud.app: INFO
