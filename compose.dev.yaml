services:
  app:
    build:
      args:
        MAVEN_PROFILE: dev
    image: tusalud-api:dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MFA_CLAVE_CIFRADO: ${MFA_CLAVE_CIFRADO:-clave-de-desarrollo-para-cifrar-secretos-mfa}
      PAGOS_SIMULACION_HABILITADA: ${PAGOS_SIMULACION_HABILITADA:-true}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tusalud,deployment.environment.name=dev

  web:
    build:
      args:
        BUILD_CONFIGURATION: dev
    image: tusalud-web:dev
