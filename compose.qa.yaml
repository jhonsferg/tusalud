services:
  app:
    build:
      args:
        MAVEN_PROFILE: qa
    image: tusalud-api:qa
    environment:
      SPRING_PROFILES_ACTIVE: qa
      DATA_INITIALIZER_ENABLED: ${DATA_INITIALIZER_ENABLED:-true}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tusalud,deployment.environment.name=qa

  web:
    build:
      args:
        BUILD_CONFIGURATION: qa
    image: tusalud-web:qa
