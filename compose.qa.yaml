services:
  app:
    build:
      args:
        MAVEN_PROFILE: qa
    image: tusalud-api:qa
    environment:
      SPRING_PROFILES_ACTIVE: qa
      MFA_CLAVE_CIFRADO: ${MFA_CLAVE_CIFRADO:-clave-de-desarrollo-para-cifrar-secretos-mfa}
      PAGOS_SIMULACION_HABILITADA: ${PAGOS_SIMULACION_HABILITADA:-true}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tusalud,deployment.environment.name=qa

  web:
    build:
      args:
        BUILD_CONFIGURATION: qa
    image: tusalud-web:qa
