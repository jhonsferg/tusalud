name: tusalud

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_PROFILE: prod
    image: tusalud-api:vps
    container_name: tusalud-api
    restart: unless-stopped
    mem_limit: 900m
    entrypoint: ["java", "-XX:+UseCompactObjectHeaders", "-jar", "/app/app.jar"]
    ports:
      - "127.0.0.1:10010:8080"
    depends_on:
      - almacen-proxy
    networks:
      - databases
      - interna
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://databases_postgres:5432/${TUSALUD_DB_NAME}
      DB_USERNAME: ${TUSALUD_DB_USER}
      DB_PASSWORD: ${TUSALUD_DB_PASSWORD}
      DB_POOL_MAX_SIZE: 10
      DB_POOL_MIN_IDLE: 2
      JWT_SECRET: ${JWT_SECRET}
      MFA_CLAVE_CIFRADO: ${MFA_CLAVE_CIFRADO}
      PAGOS_SIMULACION_HABILITADA: "true"
      TURN_HABILITADO: "false"
      TURN_SECRET: ${TURN_SECRET}
      CANALES_URL_BASE: https://tusalud.codesoftlabs.com
      CANALES_SECRETO: ${CANALES_SECRETO}
      CANALES_WEBHOOK_SECRETO: ${CANALES_WEBHOOK_SECRETO}
      RESPALDO_TOKEN: ${RESPALDO_TOKEN}
      RESPALDOS_MAX_HORAS: 100000
      RESPALDOS_MAX_DIAS_SIN_PRUEBA: 100000
      STORAGE_TIPO: s3
      STORAGE_ENDPOINT: http://almacen-proxy:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: ${TUSALUD_STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${TUSALUD_STORAGE_SECRET_KEY}
      STORAGE_BUCKET_AVATARES: tusalud-avatares
      STORAGE_BUCKET_IMAGENES: tusalud-imagenes
      STORAGE_BUCKET_DOCUMENTOS: tusalud-documentos
      STORAGE_BUCKET_REPORTES: tusalud-reportes
      STORAGE_BUCKET_PLANTILLAS: tusalud-plantillas
      CORS_ALLOWED_ORIGINS: https://tusalud.codesoftlabs.com
      JDK_JAVA_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      OTEL_SDK_DISABLED: "true"

  almacen-proxy:
    image: nginxinc/nginx-unprivileged:1.30-alpine-slim
    container_name: tusalud-almacen-proxy
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./docker/vps/almacen-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - storages
      - interna

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: vps
        SECURITY_HEADERS: security-headers.vps.conf
    image: tusalud-web:vps
    container_name: tusalud-web
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:10011:8080"
    networks:
      - interna

networks:
  databases:
    external: true
  storages:
    external: true
  interna:
    driver: bridge
