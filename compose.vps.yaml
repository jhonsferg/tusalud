name: tusalud

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_PROFILE: prod
    image: tusalud-api:vps
    container_name: tusalud-api
    restart: unless-stopped
    mem_limit: 900m
    entrypoint: ["java", "-XX:+UseCompactObjectHeaders", "-jar", "/app/app.jar"]
    ports:
      - "127.0.0.1:10010:8080"
    depends_on:
      - almacen-proxy
    networks:
      - databases
      - interna
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      FACTURACION_CERTIFICADO_PRUEBA: ${FACTURACION_CERTIFICADO_PRUEBA:-false}
      DB_URL: jdbc:postgresql://databases_postgres:5432/${TUSALUD_DB_NAME}
      DB_USERNAME: ${TUSALUD_DB_USER}
      DB_PASSWORD: ${TUSALUD_DB_PASSWORD}
      DB_POOL_MAX_SIZE: 10
      DB_POOL_MIN_IDLE: 2
      JWT_SECRET: ${JWT_SECRET}
      MFA_CLAVE_CIFRADO: ${MFA_CLAVE_CIFRADO}
      PAGOS_SIMULACION_HABILITADA: "true"
      TURN_HABILITADO: "true"
      TURN_HOST: tusalud.codesoftlabs.com
      TURN_PORT: 3478
      TURN_SECRET: ${TURN_SECRET}
      CANALES_URL_BASE: https://tusalud.codesoftlabs.com
      CANALES_SECRETO: ${CANALES_SECRETO}
      CANALES_WEBHOOK_SECRETO: ${CANALES_WEBHOOK_SECRETO}
      RESPALDO_TOKEN: ${RESPALDO_TOKEN}
      RESPALDOS_MAX_HORAS: 100000
      RESPALDOS_MAX_DIAS_SIN_PRUEBA: 100000
      STORAGE_TIPO: s3
      STORAGE_ENDPOINT: http://almacen-proxy:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: ${TUSALUD_STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${TUSALUD_STORAGE_SECRET_KEY}
      STORAGE_BUCKET_AVATARES: tusalud-avatares
      STORAGE_BUCKET_IMAGENES: tusalud-imagenes
      STORAGE_BUCKET_DOCUMENTOS: tusalud-documentos
      STORAGE_BUCKET_REPORTES: tusalud-reportes
      STORAGE_BUCKET_PLANTILLAS: tusalud-plantillas
      CORS_ALLOWED_ORIGINS: https://tusalud.codesoftlabs.com
      JDK_JAVA_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      OTEL_SDK_DISABLED: "true"

  almacen-proxy:
    image: nginxinc/nginx-unprivileged:1.30-alpine-slim
    container_name: tusalud-almacen-proxy
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./docker/vps/almacen-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - storages
      - interna

  turn:
    image: coturn/coturn:4.7.0-alpine
    container_name: tusalud-turn
    restart: unless-stopped
    mem_limit: 128m
    command:
      - "--log-file=stdout"
      - "--realm=tusalud"
      - "--use-auth-secret"
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--fingerprint"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
      - "--no-tcp-relay"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--external-ip=${TURN_EXTERNAL_IP}"
    volumes:
      - ./docker/vps/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: vps
        SECURITY_HEADERS: security-headers.vps.conf
    image: tusalud-web:vps
    container_name: tusalud-web
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - interna

  anubis:
    image: ghcr.io/techarohq/anubis:latest
    container_name: tusalud-anubis
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - web
    ports:
      - "127.0.0.1:10012:8923"
    volumes:
      - ./docker/vps/anubis-politica.yaml:/etc/anubis/politica.yaml:ro
    networks:
      - interna
    environment:
      BIND: ":8923"
      TARGET: http://web:8080
      DIFFICULTY: "4"
      ED25519_PRIVATE_KEY_HEX: ${ANUBIS_CLAVE}
      COOKIE_DOMAIN: tusalud.codesoftlabs.com
      REDIRECT_DOMAINS: tusalud.codesoftlabs.com
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: Lax
      COOKIE_EXPIRATION_TIME: 168h
      POLICY_FNAME: /etc/anubis/politica.yaml
      SERVE_ROBOTS_TXT: "true"
      SLOG_LEVEL: INFO

networks:
  databases:
    external: true
  storages:
    external: true
  interna:
    driver: bridge
