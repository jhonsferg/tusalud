services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    image: tusalud-web:hot
    environment: !override
      PORT: "4200"
      WATCH: ${WEB_WATCH:-}
    healthcheck:
      disable: true
    expose: !override
      - "4200"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-dist:/app/dist
      - web-angular-cache:/app/.angular

  gateway:
    environment:
      FRONT_UPSTREAM: http://web:4200

volumes:
  web-node-modules:
  web-dist:
  web-angular-cache:
