name: tusalud

services:
  postgres:
    image: postgres:18-alpine
    container_name: tusalud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tusalud
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: tusalud-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: tusalud-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      - jaeger

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_PROFILE: prod
    image: tusalud-api:prod
    container_name: tusalud-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/tusalud
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-ZRGfomiAMg+Et+SnCC/cQ5Ud36Rw1PYVE8BtFOLayw9vAArCf/mi06aVKLxcIzGXZBQf1sZBmB1D8nCqQP6dtQ==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      MFA_CLAVE_CIFRADO: ${MFA_CLAVE_CIFRADO:-}
      PAGOS_SIMULACION_HABILITADA: ${PAGOS_SIMULACION_HABILITADA:-false}
      TURN_HOST: ${TURN_HOST:-localhost}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HABILITADO: ${TURN_HABILITADO:-true}
      TELEMEDICINA_VENTANA_ANTES_MIN: ${TELEMEDICINA_VENTANA_ANTES_MIN:-10}
      TELEMEDICINA_VENTANA_DESPUES_MIN: ${TELEMEDICINA_VENTANA_DESPUES_MIN:-30}
      FACTURACION_CERTIFICADO_RUTA: ${FACTURACION_CERTIFICADO_RUTA:-}
      FACTURACION_CERTIFICADO_CLAVE: ${FACTURACION_CERTIFICADO_CLAVE:-}
      FACTURACION_CERTIFICADO_ALIAS: ${FACTURACION_CERTIFICADO_ALIAS:-}
      FACTURACION_SOL_USUARIO: ${FACTURACION_SOL_USUARIO:-}
      FACTURACION_SOL_CLAVE: ${FACTURACION_SOL_CLAVE:-}
      FACTURACION_URL_CONSULTA: ${FACTURACION_URL_CONSULTA:-https://e-consulta.sunat.gob.pe/ol-ti-itconsvalicpe/ConsValiCpe.htm}
      PRIVACIDAD_RETENCION_HABILITADA: ${PRIVACIDAD_RETENCION_HABILITADA:-true}
      CANALES_URL_BASE: ${CANALES_URL_BASE:-}
      CANALES_SECRETO: ${CANALES_SECRETO:-}
      CANALES_WEBHOOK_SECRETO: ${CANALES_WEBHOOK_SECRETO:-}
      CANALES_CENTRO: ${CANALES_CENTRO:-TuSalud}
      CANALES_CORREO_PROVEEDOR: ${CANALES_CORREO_PROVEEDOR:-simulado}
      CANALES_CORREO_REMITENTE: ${CANALES_CORREO_REMITENTE:-no-responder@tusalud.local}
      CANALES_SMS_PROVEEDOR: ${CANALES_SMS_PROVEEDOR:-simulado}
      CANALES_SMS_URL: ${CANALES_SMS_URL:-}
      CANALES_SMS_AUTENTICACION: ${CANALES_SMS_AUTENTICACION:-NONE}
      CANALES_SMS_USUARIO: ${CANALES_SMS_USUARIO:-}
      CANALES_SMS_SECRETO: ${CANALES_SMS_SECRETO:-}
      CANALES_SMS_FORMATO: ${CANALES_SMS_FORMATO:-FORM}
      CANALES_SMS_CUERPO: ${CANALES_SMS_CUERPO:-}
      CANALES_WHATSAPP_PROVEEDOR: ${CANALES_WHATSAPP_PROVEEDOR:-simulado}
      CANALES_WHATSAPP_URL: ${CANALES_WHATSAPP_URL:-}
      CANALES_WHATSAPP_SECRETO: ${CANALES_WHATSAPP_SECRETO:-}
      CANALES_WHATSAPP_CUERPO: ${CANALES_WHATSAPP_CUERPO:-}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USUARIO:-}
      SPRING_MAIL_PASSWORD: ${SMTP_CLAVE:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTENTICACION:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS:-true}
      RESPALDO_TOKEN: ${RESPALDO_TOKEN:-}
      RESPALDOS_MAX_HORAS: ${RESPALDOS_MAX_HORAS:-26}
      STORAGE_TIPO: s3
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JDK_JAVA_OPTIONS: ${JDK_JAVA_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tusalud-api}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tusalud,deployment.environment.name=prod
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp

  storage:
    image: chrislusf/seaweedfs:4.54
    container_name: tusalud-storage
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/seaweedfs/arrancar.sh"]
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_VOLUME_MB: ${STORAGE_VOLUME_MB:-1024}
      STORAGE_MAX_VOLUMES: ${STORAGE_MAX_VOLUMES:-100}
    volumes:
      - ./docker/storage/arrancar.sh:/etc/seaweedfs/arrancar.sh:ro
      - storage-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && (wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q "HTTP/1.1 403")
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  storage-init:
    image: chrislusf/seaweedfs:4.54
    container_name: tusalud-storage-init
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/seaweedfs/crear-buckets.sh"]
    environment:
      STORAGE_MASTER: storage:9333
      STORAGE_BUCKETS: avatares imagenes documentos reportes plantillas
    volumes:
      - ./docker/storage/crear-buckets.sh:/etc/seaweedfs/crear-buckets.sh:ro

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    image: tusalud-backup:prod
    container_name: tusalud-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tusalud
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKETS: avatares imagenes documentos reportes plantillas
      RESPALDO_PASSPHRASE: ${RESPALDO_PASSPHRASE:-}
      RESPALDO_TOKEN: ${RESPALDO_TOKEN:-}
      API_URL: http://app:8080
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      TEST_CRON: ${TEST_CRON:-30 3 * * 0}
      RETENCION_DIARIOS: ${RETENCION_DIARIOS:-7}
      RETENCION_SEMANALES: ${RETENCION_SEMANALES:-4}
      RETENCION_MENSUALES: ${RETENCION_MENSUALES:-6}
      RESPALDO_REMOTO_ENDPOINT: ${RESPALDO_REMOTO_ENDPOINT:-}
      RESPALDO_REMOTO_BUCKET: ${RESPALDO_REMOTO_BUCKET:-}
      RESPALDO_REMOTO_ACCESS_KEY: ${RESPALDO_REMOTO_ACCESS_KEY:-}
      RESPALDO_REMOTO_SECRET_KEY: ${RESPALDO_REMOTO_SECRET_KEY:-}
    volumes:
      - backup-data:/respaldos

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: production
    image: tusalud-web:prod
    container_name: tusalud-web
    restart: unless-stopped
    expose:
      - "8080"

  turn:
    image: coturn/coturn:4.7.0-alpine
    container_name: tusalud-turn
    restart: unless-stopped
    command:
      - "--log-file=stdout"
      - "--realm=tusalud"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-}"
      - "--listening-port=3478"
      - "--min-port=${TURN_RELAY_MIN:-49160}"
      - "--max-port=${TURN_RELAY_MAX:-49200}"
      - "--fingerprint"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
      - "--no-tcp-relay"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--external-ip=${TURN_EXTERNAL_IP:-}"
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49200}:${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49200}/udp"

  gateway:
    build:
      context: ./docker/gateway
      dockerfile: Dockerfile
    image: tusalud-gateway:prod
    container_name: tusalud-gateway
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      API_UPSTREAM: http://app:8080
      FRONT_UPSTREAM: http://web:8080
      NGINX_RESOLVER: 127.0.0.11
      GATEWAY_TLS: ${GATEWAY_TLS:-off}
      GATEWAY_SERVER_NAME: ${GATEWAY_SERVER_NAME:-_}
      GATEWAY_HTTPS_REDIRECT_PORT: ${GATEWAY_HTTPS_REDIRECT_PORT:-}
      GATEWAY_EXPONER_DOCS: ${GATEWAY_EXPONER_DOCS:-off}
      GATEWAY_MAX_BODY_DEFAULT: ${GATEWAY_MAX_BODY_DEFAULT:-1m}
      GATEWAY_MAX_BODY_UPLOAD: ${GATEWAY_MAX_BODY_UPLOAD:-25m}
      RATE_KEY: ${RATE_KEY:-$$binary_remote_addr}
      RATE_LOGIN: ${RATE_LOGIN:-10r/m}
      RATE_REFRESH: ${RATE_REFRESH:-30r/m}
      RATE_MFA: ${RATE_MFA:-10r/m}
      RATE_REGISTRO: ${RATE_REGISTRO:-5r/m}
      RATE_VERIFICACION: ${RATE_VERIFICACION:-30r/m}
      RATE_GENERAL: ${RATE_GENERAL:-600r/m}
      RATE_BURST_AUTH: ${RATE_BURST_AUTH:-5}
      RATE_BURST_GENERAL: ${RATE_BURST_GENERAL:-100}
    volumes:
      - ${GATEWAY_CERTS_DIR:-./docker/gateway/certs}:/etc/nginx/certs:ro
    ports:
      - "${GATEWAY_PORT:-80}:8080"
      - "${GATEWAY_TLS_PORT:-443}:8443"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tusalud-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tusalud.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-data:
  pgadmin-data:
  storage-data:
  backup-data:
