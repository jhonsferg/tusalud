name: tusalud

services:
  postgres:
    image: postgres:18-alpine
    container_name: tusalud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tusalud
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: tusalud-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: tusalud-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      - jaeger

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_PROFILE: prod
    image: tusalud-api:prod
    container_name: tusalud-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/tusalud
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-ZRGfomiAMg+Et+SnCC/cQ5Ud36Rw1PYVE8BtFOLayw9vAArCf/mi06aVKLxcIzGXZBQf1sZBmB1D8nCqQP6dtQ==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      DATA_INITIALIZER_ENABLED: ${DATA_INITIALIZER_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tusalud-api}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tusalud,deployment.environment.name=prod
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    ports:
      - "${APP_PORT:-8080}:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: production
    image: tusalud-web:prod
    container_name: tusalud-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      API_UPSTREAM: http://app:8080
      NGINX_RESOLVER: 127.0.0.11
    ports:
      - "${WEB_PORT:-4200}:80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tusalud-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tusalud.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-data:
  pgadmin-data:
